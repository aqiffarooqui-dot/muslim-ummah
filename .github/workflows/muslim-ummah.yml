name: Muslim Ummah Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish signed APK as GitHub Release v1.0.3"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: muslim-ummah-build
  cancel-in-progress: true

env:
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

jobs:
  web:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled offline Hadith data
        run: bash scripts/prepare-offline-hadith.sh

      - name: Build production web bundle
        env:
          NATIVE_ANDROID_BUILD: "true"
        run: npm run build:web

      - name: Validate generated web assets
        run: |
          test -s dist/index.html
          test -d dist/_expo
          test -d dist/assets
          test -d dist/hadith-covers
          test -s dist/offline-hadith/README.txt

      - name: Create portable web bundle archive
        run: tar -czf muslim-ummah-web-bundle.tar.gz -C dist .

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: muslim-ummah-web-bundle
          path: muslim-ummah-web-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Deploy GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: muslim-ummah-web-bundle
          path: bundle

      - name: Extract web bundle
        run: |
          rm -rf dist
          mkdir -p dist
          tar -xzf bundle/muslim-ummah-web-bundle.tar.gz -C dist
          test -s dist/index.html
          test -d dist/_expo

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  android:
    name: Build native signed APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 61
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: muslim-ummah-web-bundle
          path: bundle

      - name: Extract web bundle
        working-directory: .
        run: |
          rm -rf dist
          mkdir -p dist
          tar -xzf bundle/muslim-ummah-web-bundle.tar.gz -C dist
          test -s dist/index.html
          test -d dist/_expo

      - name: Package web app inside APK
        working-directory: .
        run: |
          rm -rf native-android/app/src/main/assets/*
          mkdir -p native-android/app/src/main/assets
          cp -R dist/. native-android/app/src/main/assets/
          test -f native-android/app/src/main/assets/index.html
          test -s native-android/app/src/main/assets/offline-hadith/README.txt
          test -d native-android/app/src/main/assets/hadith-covers
          test -d native-android/app/src/main/assets/_expo

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          test -s release-key.jks

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muslim-ummah-release-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release v1.0.3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: Muslim Ummah v1.0.3
          body: |
            Muslim Ummah v1.0.3 signed Android release.
            Bundles the production app inside the APK for offline startup and local app data.
            Includes the latest Quran/Hadith fixes.
          files: native-android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
