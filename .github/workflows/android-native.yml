name: Build Muslim Ummah Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: native-android/release-key.jks
          key: muslim-ummah-signing-key-v1

      - name: Create stable signing key if missing
        shell: bash
        run: |
          if [ ! -f release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore release-key.jks \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: muslim-ummah-release-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release and OTA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk muslim-ummah-1.0.3.apk
          gh release create v1.0.3 muslim-ummah-1.0.3.apk --target "${GITHUB_SHA}" --title "Muslim Ummah 1.0.3" --generate-notes

          cat > ../public-update.json <<'EOF'
{
  "version": "1.0.3",
  "versionCode": 4,
  "apkUrl": "https://github.com/aqiffarooqui-dot/muslim-ummah/releases/download/v1.0.3/muslim-ummah-1.0.3.apk",
  "changes": [
    "Signed native Android release.",
    "OTA update checking and installation enabled."
  ]
}
EOF

          cd ..
          mkdir -p public
          mv public-update.json public/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/update.json
          git commit -m "Publish OTA manifest for v1.0.3"
          git push origin HEAD:main
