name: Build Muslim Ummah Native APK
# Native Hadith chapter-flow validation build

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          test -s release-key.jks

      - name: Bundle offline Free content
        run: |
          set -e
          mkdir -p app/src/main/assets/quran app/src/main/assets/hadith
          cp ../src/data/quran-uthmani.txt app/src/main/assets/quran/quran_arabic.txt
          curl -fsSL https://raw.githubusercontent.com/druvx13/Quran-data/cairo/data/ur.jalandhry.txt -o app/src/main/assets/quran/quran_urdu.txt
          curl -fsSL https://raw.githubusercontent.com/druvx13/Quran-data/cairo/data/ur.romanmaududi.txt -o app/src/main/assets/quran/quran_hinglish.txt
          curl -fsSL https://raw.githubusercontent.com/druvx13/Quran-data/cairo/data/en.sahih.txt -o app/src/main/assets/quran/quran_english.txt
          rm -rf /tmp/hadith-json
          git clone --depth 1 --branch v1.2.0 https://github.com/AhmedBaset/hadith-json.git /tmp/hadith-json
          cp -R /tmp/hadith-json/db/by_chapter/the_9_books app/src/main/assets/hadith/the_9_books

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muslim-ummah-release-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release v1.0.3
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: Muslim Ummah v1.0.3
          body: |
            Muslim Ummah v1.0.3 signed Android release.
            Includes automatic OTA update checking and Quran stability fixes.
          files: native-android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
