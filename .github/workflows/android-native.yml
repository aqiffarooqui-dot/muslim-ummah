name: Build Muslim Ummah Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: muslim-ummah-release-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk muslim-ummah-1.0.3.apk
          gh release create v1.0.3 muslim-ummah-1.0.3.apk --target "${GITHUB_SHA}" --title "Muslim Ummah 1.0.3" --generate-notes
