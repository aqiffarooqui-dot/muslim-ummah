name: Build Muslim Ummah Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: native-android/release-key.jks
          key: muslim-ummah-signing-key-v1

      - name: Create stable signing key if missing
        run: |
          if [ ! -f release-key.jks ]; then
            keytool -genkeypair -v -keystore release-key.jks -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: muslim-ummah-release-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk
