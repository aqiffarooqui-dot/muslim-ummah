name: Build Muslim Ummah Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'
      - 'App.tsx'
      - 'src/**'
      - 'QuranScreen.tsx'
      - 'AboutScreen.tsx'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web app dependencies
        working-directory: .
        run: npm ci

      - name: Build production web bundle
        working-directory: .
        run: npm run build:web

      - name: Package web app inside APK
        working-directory: .
        run: |
          rm -rf native-android/app/src/main/assets/web
          mkdir -p native-android/app/src/main/assets/web
          cp -R dist/. native-android/app/src/main/assets/web/
          test -f native-android/app/src/main/assets/web/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          test -s release-key.jks

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muslim-ummah-release-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release v1.0.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: Muslim Ummah v1.0.3
          body: |
            Muslim Ummah v1.0.3 signed Android release.
            Bundles the production app inside the APK for offline startup and local app data.
            Includes automatic OTA update checking and the latest Quran/Hadith fixes.
          files: native-android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
