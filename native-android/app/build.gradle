plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aqiffarooqui.muslimummah'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aqiffarooqui.muslimummah'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
}
