// Release build configuration for Muslim Ummah OTA
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aqiffarooqui.muslimummah'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aqiffarooqui.muslimummah'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        release {
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
            def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

            if (!keystorePassword || !signingKeyAlias || !signingKeyPassword) {
                throw new GradleException("Android signing secrets are not configured.")
            }

            storeFile file('../release-key.jks')
            storePassword keystorePassword
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
}
