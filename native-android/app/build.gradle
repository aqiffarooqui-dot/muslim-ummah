// Release build configuration for Muslim Ummah OTA
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aqiffarooqui.muslimummah'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aqiffarooqui.muslimummah'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        release {
            storeFile file('../release-key.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
}
