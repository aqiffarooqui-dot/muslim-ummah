// Native Android app: Compose UI with legacy WebView isolated for migration.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.aqiffarooqui.muslimummah'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aqiffarooqui.muslimummah'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        release {
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
            def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

            if (!keystorePassword || !signingKeyAlias || !signingKeyPassword) {
                throw new GradleException("Android signing secrets are not configured.")
            }

            storeFile file('../release-key.jks')
            storePassword keystorePassword
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.02.00")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.webkit:webkit:1.17.1"
}
